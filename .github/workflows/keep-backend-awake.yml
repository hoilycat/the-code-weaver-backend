name: Keep backend awake

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend
        run: |
          curl --silent --show-error --max-time 90 \
            https://the-code-weaver-backend.onrender.com/api/projects/wake-up || true
