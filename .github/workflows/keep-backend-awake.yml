name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://the-code-weaver-backend.onrender.com/api/projects/wake-up
