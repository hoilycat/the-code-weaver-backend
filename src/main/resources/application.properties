# [1] 관리자 비밀번호 (환경 변수에서 가져오되, 없으면 weaver1234 사용)
admin.password=${MY_ADMIN_PASSWORD:weaver1234}

# [2] 파일 업로드 용량 제한 (사진 10장을 위해 넉넉하게 설정)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# [3] 데이터베이스 설정
# spring.datasource.driverClassName=org.h2.Driver (PostgreSQL을 사용하므로 주석 처리)
# 1. PostgreSQL 연결 정보 (배포 환경 변수 우선, 없으면 로컬 정보 사용)
# SSL 필수 및 Pooler 포트(5432) 사용
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.hqefyvwzlhytnmhqbggt}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:weaver1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL 방언 설정 (명시적)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# [4] H2 콘솔 활성화 (브라우저에서 DB 볼 수 있게 함)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# [5] JPA/Hibernate 설정 (데이터 구조가 바뀌면 자동으로 테이블 업데이트)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# [6] Supabase Storage 설정
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:images}

